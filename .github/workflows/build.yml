name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run type-check

  build:
    name: Build Extensions (Ubuntu)
    runs-on: ubuntu-latest
    needs: check

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Create extension archives
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for browser in chrome firefox; do
            mkdir "Nydia-$browser-v$VERSION"
            cp -r "build/$browser/"* "Nydia-$browser-v$VERSION/"
            zip -r "Nydia-$browser-v$VERSION.zip" "Nydia-$browser-v$VERSION"
          done

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: extensions
          path: |
            Nydia-chrome-v${{ steps.version.outputs.version }}.zip
            Nydia-firefox-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  windows:
    name: Build Extensions (Windows)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: extensions
          path: .

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          files=("Nydia-chrome-v$VERSION.zip" "Nydia-firefox-v$VERSION.zip")
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          state=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')
          case "$state" in
            '') gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes '' "${prerelease[@]}" "${files[@]}" ;;
            draft)
              gh release upload "$TAG" "${files[@]}" --clobber
              if [[ ${#prerelease[@]} -gt 0 ]]; then gh release edit "$TAG" "${prerelease[@]}"; fi ;;
            published) echo "::notice::$TAG is already published, so its release stays unchanged." ;;
            *) echo "::error::More than one release uses $TAG."; exit 1 ;;
          esac