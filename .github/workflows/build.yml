name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - '**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    outputs:
      CLEAN_TAG: ${{ steps.extract_version.outputs.CLEAN_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Extract version
        id: extract_version
        run: |
          echo "CLEAN_TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create extension archives (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir Nydia-chrome-v${{ steps.extract_version.outputs.CLEAN_TAG }}
          mkdir Nydia-firefox-v${{ steps.extract_version.outputs.CLEAN_TAG }}
          cp -r build/chrome/* Nydia-chrome-v${{ steps.extract_version.outputs.CLEAN_TAG }}/
          cp -r build/firefox/* Nydia-firefox-v${{ steps.extract_version.outputs.CLEAN_TAG }}/
          zip -r Nydia-chrome-v${{ steps.extract_version.outputs.CLEAN_TAG }}.zip Nydia-chrome-v${{ steps.extract_version.outputs.CLEAN_TAG }}
          zip -r Nydia-firefox-v${{ steps.extract_version.outputs.CLEAN_TAG }}.zip Nydia-firefox-v${{ steps.extract_version.outputs.CLEAN_TAG }}

      - name: Upload artifacts (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: extensions
          path: |
            Nydia-chrome-v${{ steps.extract_version.outputs.CLEAN_TAG }}.zip
            Nydia-firefox-v${{ steps.extract_version.outputs.CLEAN_TAG }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: extensions
          path: .

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.CLEAN_TAG }}
        run: |
          files=("Nydia-chrome-v$VERSION.zip" "Nydia-firefox-v$VERSION.zip")
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          state=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')
          case "$state" in
            '') gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes '' "${prerelease[@]}" "${files[@]}" ;;
            draft)
              gh release upload "$TAG" "${files[@]}" --clobber
              if [[ ${#prerelease[@]} -gt 0 ]]; then gh release edit "$TAG" "${prerelease[@]}"; fi ;;
            published) echo "::notice::$TAG is already published, so its release stays unchanged." ;;
            *) echo "::error::More than one release uses $TAG."; exit 1 ;;
          esac