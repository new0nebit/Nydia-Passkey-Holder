name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run type-check

  build:
    name: Build Extensions (Ubuntu)
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Create extension archives
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for browser in chrome firefox; do
            mkdir "Nydia-$browser-v$VERSION"
            cp -r "build/$browser/"* "Nydia-$browser-v$VERSION/"
            zip -r "Nydia-$browser-v$VERSION.zip" "Nydia-$browser-v$VERSION"
          done

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extensions
          path: |
            Nydia-chrome-v${{ steps.version.outputs.version }}.zip
            Nydia-firefox-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  windows:
    name: Build Extensions (Windows)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    needs: check
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  safari:
    name: Build Safari App (macOS)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    needs: check
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build the Safari extension
        run: npm run build:safari

      - name: Build the Safari app
        run: |
          xcodebuild -version
          xcodebuild -project "app/Nydia Passkey Holder.xcodeproj" -scheme "Nydia Passkey Holder" \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO build
