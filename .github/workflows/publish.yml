name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions
          path: .

      - name: Attest the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            Nydia-chrome-v${{ needs.ci.outputs.version }}.zip
            Nydia-firefox-v${{ needs.ci.outputs.version }}.zip

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          files=("Nydia-chrome-v$VERSION.zip" "Nydia-firefox-v$VERSION.zip")
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          state=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')
          case "$state" in
            '') gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes '' "${prerelease[@]}" "${files[@]}" ;;
            draft)
              gh release upload "$TAG" "${files[@]}" --clobber
              if [[ ${#prerelease[@]} -gt 0 ]]; then gh release edit "$TAG" "${prerelease[@]}"; fi ;;
            published) echo "::notice::$TAG is already published, so its release stays unchanged." ;;
            *) echo "::error::More than one release uses $TAG."; exit 1 ;;
          esac
