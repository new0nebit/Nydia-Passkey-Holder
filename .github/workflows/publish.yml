name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  dmg:
    name: Build Safari DMG (macOS)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: ci
    environment: release-signing
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build the Safari extension
        run: npm run build:safari

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          trap 'rm -f "$RUNNER_TEMP/developer-id.p12"' EXIT
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Archive the app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "app/Nydia Passkey Holder.xcodeproj" \
            -scheme "Nydia Passkey Holder" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Nydia.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export the app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nydia.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Create the disk image
        env:
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          DMG="Nydia-safari-v$VERSION.dmg"
          mkdir "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/export/Nydia for Safari.app" "$RUNNER_TEMP/dmg/Nydia for Safari.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Nydia for Safari" -srcfolder "$RUNNER_TEMP/dmg" -format UDZO -ov "$DMG"
          codesign --sign "Developer ID Application" --timestamp "$DMG"

      - name: Notarize the disk image
        env:
          VERSION: ${{ needs.ci.outputs.version }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          DMG="Nydia-safari-v$VERSION.dmg"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_API_KEY_ID.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID")
          xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --output-format json > "$RUNNER_TEMP/notary.json" || true
          ID="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")"
          STATUS="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")"
          echo "Notarization $ID: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Check the app in the disk image
        env:
          VERSION: ${{ needs.ci.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="Nydia-safari-v$VERSION.dmg"
          MOUNT="$(mktemp -d "$RUNNER_TEMP/dmg.XXXXXX")"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -quiet || hdiutil detach "$MOUNT" -force -quiet' EXIT
          APP="$MOUNT/Nydia for Safari.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 \
            -R="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\" and identifier \"me.Nydia.Safari\"" \
            "$APP"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari
          path: Nydia-safari-v${{ needs.ci.outputs.version }}.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ci, dmg]
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions
          path: .

      - name: Download the disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: safari
          path: .

      - name: Attest the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            Nydia-chrome-v${{ needs.ci.outputs.version }}.zip
            Nydia-firefox-v${{ needs.ci.outputs.version }}.zip
            Nydia-safari-v${{ needs.ci.outputs.version }}.dmg

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          files=("Nydia-chrome-v$VERSION.zip" "Nydia-firefox-v$VERSION.zip" "Nydia-safari-v$VERSION.dmg")
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          state=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')
          case "$state" in
            '') gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes '' "${prerelease[@]}" "${files[@]}" ;;
            draft)
              gh release upload "$TAG" "${files[@]}" --clobber
              if [[ ${#prerelease[@]} -gt 0 ]]; then gh release edit "$TAG" "${prerelease[@]}"; fi ;;
            published) echo "::notice::$TAG is already published, so its release stays unchanged." ;;
            *) echo "::error::More than one release uses $TAG."; exit 1 ;;
          esac
